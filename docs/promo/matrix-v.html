<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>TikTok octo — dot matrix 10s</title>
    <link rel="stylesheet" href="../../src/renderer/fonts.css" />
    <style>
      /* ----------------------------------------------------------------
         Вертикальная обёртка над matrix.html: 10 с, 1080×1920.
         Логотип-точка занимает верхний квадрат, под ним — подпись,
         с 6.0 с — финал с QR. Всё состояние считается из t.
         ---------------------------------------------------------------- */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #070709;
        --ink: #f4f4f6;
        --dim: #8b8b96;
        --cyan: #25f4ee;
        --pink: #fe2c55;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        --sans: 'Inter', system-ui, sans-serif;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      #scene {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(820px 820px at 50% 40%, rgba(30, 30, 40, 0.55), transparent 72%),
          var(--bg);
      }

      /* сетка точек в текстовой части — тот же язык, что у логотипа */
      #dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(244, 244, 246, 0.5) 1.7px, transparent 1.8px);
        background-size: 38px 38px;
        opacity: 0.16;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          #000 40%,
          #000 68%,
          transparent 92%
        );
        mask-image: linear-gradient(to bottom, transparent 0, #000 40%, #000 68%, transparent 92%);
      }

      #logo {
        position: absolute;
        left: 0;
        top: 230px;
        width: 1080px;
        height: 1080px;
        border: 0;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(circle 760px at 50% 50%, #000 430px, transparent 700px);
        mask-image: radial-gradient(circle 760px at 50% 50%, #000 430px, transparent 700px);
      }

      #kicker {
        position: absolute;
        left: 0;
        right: 0;
        top: 124px;
        text-align: center;
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: var(--dim);
      }

      #name {
        position: absolute;
        left: 0;
        right: 0;
        top: 1348px;
        text-align: center;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.04;
      }

      #tagline {
        position: absolute;
        left: 0;
        right: 0;
        top: 1492px;
        text-align: center;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: var(--dim);
      }

      #cta {
        position: absolute;
        inset: 0;
      }

      #cta-kicker {
        position: absolute;
        left: 0;
        right: 0;
        top: 978px;
        text-align: center;
        font-family: var(--mono);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: var(--cyan);
      }

      #cta-title {
        position: absolute;
        left: 50px;
        right: 50px;
        top: 1032px;
        text-align: center;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.08;
        white-space: nowrap;
      }

      #qr-card {
        position: absolute;
        left: 390px;
        top: 1144px;
        width: 300px;
        height: 300px;
        padding: 18px;
        border-radius: 34px;
        background: #f4f4f6;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      }

      #qr-card img {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }

      #cta-link {
        position: absolute;
        left: 0;
        right: 0;
        top: 1506px;
        text-align: center;
        font-family: var(--mono);
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #cta-note {
        position: absolute;
        left: 0;
        right: 0;
        top: 1572px;
        text-align: center;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="dots"></div>
      <iframe id="logo" src="matrix.html" scrolling="no" tabindex="-1"></iframe>

      <div id="kicker">ПЕРВЫЙ МОД TIKTOK</div>
      <div id="name">TikTok octo</div>
      <div id="tagline">без браузера и вкладок</div>

      <div id="cta">
        <div id="cta-kicker">ГДЕ СКАЧАТЬ</div>
        <div id="cta-title">Скачивай в Telegram</div>
        <div id="qr-card"><img src="assets/telegram-qr.png" alt="" /></div>
        <div id="cta-link">t.me/tiktok_octo</div>
        <div id="cta-note">Windows · macOS · Linux</div>
      </div>
    </div>

    <script>
      'use strict';

      const DUR = 10.0;

      const $ = (id) => document.getElementById(id);
      const frame = $('logo');
      const kicker = $('kicker');
      const name = $('name');
      const tagline = $('tagline');
      const cta = $('cta');
      const ctaKicker = $('cta-kicker');
      const ctaTitle = $('cta-title');
      const qrCard = $('qr-card');
      const ctaLink = $('cta-link');
      const ctaNote = $('cta-note');

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const ramp = (t, a, b) => clamp01((t - a) / (b - a));
      const ease = (x) => x * x * (3 - 2 * x);
      const out = (t, a, b) => 1 - ramp(t, a, b);

      // появление: прозрачность + короткий подъём снизу
      function appear(el, t, a, b, rise, from, to) {
        const k = ease(ramp(t, a, b));
        el.style.opacity = String(k * out(t, from, to));
        el.style.transform = `translateY(${(1 - k) * rise}px)`;
      }

      function render(t) {
        t = Math.max(0, Math.min(DUR - 1e-4, t));

        try {
          frame.contentWindow.renderAt(t);
        } catch (err) {
          /* кадр без логотипа лучше, чем упавший рендер */
        }

        appear(kicker, t, 0.16, 0.42, 18, 5.34, 5.62);
        appear(name, t, 1.9, 2.26, 30, 5.3, 5.58);
        appear(tagline, t, 2.2, 2.56, 22, 5.36, 5.62);

        // финал догоняет выключение панели: к 6.0 с он уже виден
        const inA = ramp(t, 5.82, 6.14);
        cta.style.opacity = String(ease(inA));
        appear(ctaKicker, t, 5.9, 6.2, 16, 99, 100);
        appear(ctaTitle, t, 5.84, 6.16, 26, 99, 100);
        appear(ctaLink, t, 6.06, 6.38, 18, 99, 100);
        appear(ctaNote, t, 6.2, 6.52, 14, 99, 100);

        const q = ease(ramp(t, 5.98, 6.5));
        qrCard.style.opacity = String(q);
        qrCard.style.transform = `scale(${0.93 + 0.07 * q})`;
      }

      window.renderAt = render;
      window.DUR = DUR;

      function boot() {
        render(0);
        document.body.dataset.ready = '1';
      }

      frame.addEventListener('load', boot);
      if (frame.contentDocument && frame.contentDocument.readyState === 'complete') boot();
    </script>
  </body>
</html>
