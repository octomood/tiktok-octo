<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Снимок с аннотацией</title>
    <link rel="icon" href="assets/octo-logo-mark.png" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="win-chrome.css" />
    <link rel="stylesheet" href="annotator.css" />
  </head>
  <body class="annotator">
    <div class="octo-winbar">
      <div class="octo-winbar-brand">
        <img class="octo-winbar-icon" src="assets/octo-logo-mark.png" alt="" draggable="false" />
        <span class="octo-winbar-title">Снимок с аннотацией</span>
      </div>
      <div class="octo-winbar-controls">
        <button
          type="button"
          class="octo-winbar-btn"
          data-win-act="minimize"
          title="Свернуть"
          aria-label="Свернуть"
        >
          <svg viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M5 10h10" />
          </svg>
        </button>
        <button
          type="button"
          class="octo-winbar-btn"
          data-win-act="maximize"
          title="Развернуть"
          aria-label="Развернуть"
        >
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect class="ico-max" x="5.6" y="5.6" width="8.8" height="8.8" rx="1.6" />
            <g class="ico-restore" stroke-linecap="round">
              <path d="M7.6 7.4V5.9h6.5v6.5h-1.5" />
              <rect x="5.9" y="7.9" width="6.2" height="6.2" rx="1.2" />
            </g>
          </svg>
        </button>
        <button
          type="button"
          class="octo-winbar-btn octo-winbar-btn--close"
          data-win-act="close"
          title="Закрыть"
          aria-label="Закрыть"
        >
          <svg viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" />
          </svg>
        </button>
      </div>
    </div>

    <header class="annotator-bar">
      <span class="annotator-title">Снимок с аннотацией</span>
      <div class="annotator-tools" role="toolbar" aria-label="Инструменты">
        <button type="button" class="annotator-tool is-on" data-tool="arrow" aria-pressed="true">
          Стрелка
        </button>
        <button type="button" class="annotator-tool" data-tool="rect" aria-pressed="false">
          Рамка
        </button>
        <button type="button" class="annotator-tool" data-tool="blur" aria-pressed="false">
          Размытие
        </button>
        <button type="button" class="annotator-tool" id="btnUndo">Отменить</button>
        <button type="button" class="annotator-tool" id="btnClear">Очистить</button>
      </div>
      <div class="annotator-actions">
        <button type="button" class="annotator-btn" id="btnClose">Закрыть</button>
        <button type="button" class="annotator-btn annotator-btn--primary" id="btnSave">
          Сохранить
        </button>
      </div>
    </header>

    <main class="annotator-stage">
      <canvas id="annotateCanvas" aria-label="Снимок для аннотации"></canvas>
    </main>

    <script src="i18n-dom.js"></script>
    <script src="theme-sync.js"></script>
    <script src="ui-custom-core.js"></script>
    <script src="win-chrome.js"></script>
    <script src="annotator.js"></script>
  </body>
</html>
