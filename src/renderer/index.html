<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <title>TikTok octo</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="chrome" id="chrome">
      <header class="titlebar" id="titlebar">
        <div class="brand" title="TikTok octo">
          <img
            class="brand-mark"
            src="assets/tiktok-octo.png"
            alt="TikTok octo"
            draggable="false"
          />
          <span class="sr-only">TikTok octo</span>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <button
          type="button"
          class="icon-btn panel-toggle"
          id="btnPanel"
          title="Функции (Ctrl+Shift+B)"
          aria-label="Панель функций"
          aria-pressed="false"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3.2" y="4.2" width="13.6" height="11.6" rx="2.2" />
            <path d="M8.2 4.4v11.2" />
          </svg>
        </button>

        <nav class="nav" aria-label="Навигация по странице">
          <button
            type="button"
            class="icon-btn"
            id="btnBack"
            title="Назад (Alt+←)"
            aria-label="Назад"
            disabled
          >
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12.5 4.5 7 10l5.5 5.5" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btnForward"
            title="Вперёд (Alt+→)"
            aria-label="Вперёд"
            disabled
          >
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7.5 4.5 13 10l-5.5 5.5" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btnReload"
            title="Обновить (Ctrl+R)"
            aria-label="Обновить"
          >
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 10a6 6 0 1 1-1.9-4.35" />
              <path d="M16.4 4.2v3.5h-3.5" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="btnHome" title="Главная" aria-label="Главная">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M3.6 8.6 10 3.4l6.4 5.2v7.1a1.2 1.2 0 0 1-1.2 1.2H4.8a1.2 1.2 0 0 1-1.2-1.2z"
              />
              <path d="M8.2 16.9v-4.4h3.6v4.4" />
            </svg>
          </button>
        </nav>

        <div class="page-pill" id="pagePill">
          <span class="unread" id="unreadBadge" hidden></span>
          <span class="status-dot" id="statusDot"></span>
          <span class="page-title" id="pageTitle">TikTok</span>
        </div>

        <div class="spacer"></div>

        <div class="actions" aria-label="Режимы">
          <button
            type="button"
            class="icon-btn"
            id="btnPip"
            title="Картинка в картинке (Ctrl+Shift+P)"
            aria-label="Картинка в картинке"
            aria-pressed="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4" />
              <rect x="12" y="13" width="10" height="7" rx="2" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btnMute"
            title="Звук (Ctrl+Shift+M)"
            aria-label="Звук"
            aria-pressed="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="ico-sound"
            >
              <path
                d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
              />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
            </svg>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="ico-muted"
            >
              <path
                d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
              />
              <path d="m16 9 6 6" />
              <path d="m22 9-6 6" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btnTop"
            title="Поверх всех окон (Ctrl+Shift+O)"
            aria-label="Поверх всех окон"
            aria-pressed="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 17v5" />
              <path
                d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
              />
            </svg>
          </button>
        </div>

        <div class="win-controls" id="winControls">
          <button type="button" class="win-btn" id="btnMin" title="Свернуть" aria-label="Свернуть">
            <svg
              viewBox="0 0 20 20"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            >
              <path d="M5 10h10" />
            </svg>
          </button>
          <button
            type="button"
            class="win-btn"
            id="btnMax"
            title="Развернуть"
            aria-label="Развернуть"
          >
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect class="ico-max" x="5.6" y="5.6" width="8.8" height="8.8" rx="1.1" />
              <g class="ico-restore" stroke-linecap="round">
                <path d="M7.6 7.4V5.9h6.5v6.5h-1.5" />
                <rect x="5.9" y="7.9" width="6.2" height="6.2" rx="1" />
              </g>
            </svg>
          </button>
          <button
            type="button"
            class="win-btn win-btn--close"
            id="btnClose"
            title="Закрыть"
            aria-label="Закрыть"
          >
            <svg
              viewBox="0 0 20 20"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            >
              <path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" />
            </svg>
          </button>
        </div>

        <div class="progress" id="progress"><span></span></div>
        <div class="download" id="download" hidden><span id="downloadFill"></span></div>
      </header>

      <div class="findbar" id="findbar" role="search" aria-label="Поиск по странице" hidden>
        <svg
          class="findbar-icon"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="9" r="5.2" />
          <path d="m13 13 4 4" />
        </svg>
        <input
          id="findInput"
          class="findbar-input"
          type="text"
          placeholder="Найти на странице"
          spellcheck="false"
          autocomplete="off"
          aria-label="Текст для поиска"
        />
        <span class="findbar-count" id="findCount" aria-live="polite"></span>
        <button
          type="button"
          class="findbar-btn"
          id="btnFindPrev"
          title="Предыдущее (Shift+Enter)"
          aria-label="Предыдущее совпадение"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12.5 10 7.5l5 5" />
          </svg>
        </button>
        <button
          type="button"
          class="findbar-btn"
          id="btnFindNext"
          title="Следующее (Enter)"
          aria-label="Следующее совпадение"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 7.5 10 12.5l5-5" />
          </svg>
        </button>
        <button
          type="button"
          class="findbar-btn"
          id="btnFindClose"
          title="Закрыть (Esc)"
          aria-label="Закрыть поиск"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          >
            <path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" />
          </svg>
        </button>
      </div>
    </div>

    <aside class="panel" id="panel" aria-label="Функции TikTok octo" hidden>
      <header class="panel-head">
        <div class="panel-head-text">
          <span class="panel-head-title">Функции</span>
          <span class="panel-head-version" id="panelVersion"></span>
        </div>
        <button
          type="button"
          class="panel-close"
          id="btnPanelClose"
          title="Закрыть (Esc)"
          aria-label="Закрыть панель"
        >
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          >
            <path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" />
          </svg>
        </button>
      </header>

      <div class="panel-body">
        <section class="panel-section">
          <h2 class="panel-section-title">Страница</h2>
          <button type="button" class="panel-row" data-cmd="palette">
            <span class="panel-row-label">Палитра команд</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button type="button" class="panel-row" data-cmd="home">
            <span class="panel-row-label">Главная</span>
          </button>
          <button type="button" class="panel-row" data-cmd="hardReload">
            <span class="panel-row-label">Обновить без кэша</span>
          </button>
          <button type="button" class="panel-row" data-cmd="find">
            <span class="panel-row-label">Поиск по странице</span>
            <kbd>Ctrl F</kbd>
          </button>
          <button type="button" class="panel-row" data-cmd="screenshot">
            <span class="panel-row-label">Снимок кадра</span>
            <kbd>Ctrl Shift S</kbd>
          </button>
          <div class="panel-row panel-row--static">
            <span class="panel-row-label">Масштаб</span>
            <span class="stepper">
              <button type="button" class="stepper-btn" data-cmd="zoomOut" aria-label="Мельче">
                −
              </button>
              <button
                type="button"
                class="stepper-value"
                id="panelZoom"
                data-cmd="zoomReset"
                title="Сбросить до 100 %"
              >
                100 %
              </button>
              <button type="button" class="stepper-btn" data-cmd="zoomIn" aria-label="Крупнее">
                +
              </button>
            </span>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Воспроизведение</h2>
          <button
            type="button"
            class="panel-row"
            id="rowMute"
            role="switch"
            aria-checked="false"
            data-cmd="mute"
          >
            <span class="panel-row-label">Звук</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowPip"
            role="switch"
            aria-checked="false"
            data-cmd="pip"
          >
            <span class="panel-row-label">Картинка в картинке</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowOnTop"
            role="switch"
            aria-checked="false"
            data-cmd="onTop"
          >
            <span class="panel-row-label">Поверх всех окон</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button type="button" class="panel-row" data-cmd="togglePlayback">
            <span class="panel-row-label">Играть / пауза</span>
            <kbd>Media</kbd>
          </button>
          <div class="panel-row panel-row--static">
            <span class="panel-row-label" id="sleepLabel">Таймер сна</span>
            <span class="timer-group" role="group" aria-label="Таймер сна">
              <button type="button" class="timer-btn" data-sleep="15" title="15 минут">15</button>
              <button type="button" class="timer-btn" data-sleep="30" title="30 минут">30</button>
              <button type="button" class="timer-btn" data-sleep="60" title="60 минут">60</button>
              <button
                type="button"
                class="timer-btn timer-btn--off"
                data-sleep="0"
                title="Выключить таймер"
                aria-label="Выключить таймер"
              >
                ×
              </button>
            </span>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Плеер</h2>
          <div class="panel-row panel-row--static">
            <span class="panel-row-label">Скорость</span>
            <span class="speed-group" role="group" aria-label="Скорость воспроизведения">
              <button type="button" class="speed-btn" data-player-speed="0.5">0.5×</button>
              <button type="button" class="speed-btn" data-player-speed="1">1×</button>
              <button type="button" class="speed-btn" data-player-speed="1.5">1.5×</button>
              <button type="button" class="speed-btn" data-player-speed="2">2×</button>
            </span>
          </div>
          <button
            type="button"
            class="panel-row"
            id="rowStartMuted"
            role="switch"
            aria-checked="false"
            data-player-toggle="startMuted"
          >
            <span class="panel-row-label">Запускать без звука</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowLoop"
            role="switch"
            aria-checked="false"
            data-player-toggle="loop"
          >
            <span class="panel-row-label">Повторять видео</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowPauseBlur"
            role="switch"
            aria-checked="false"
            data-player-toggle="pauseOnBlur"
          >
            <span class="panel-row-label">Пауза в фоне</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Загрузки</h2>
          <div class="download-list" id="panelDownloads"></div>
          <p class="panel-empty" id="downloadsEmpty">Пока ничего не скачано</p>
          <button type="button" class="panel-row" data-cmd="openDownloads">
            <span class="panel-row-label">Открыть папку загрузок</span>
          </button>
          <button type="button" class="panel-row" data-cmd="downloadClear">
            <span class="panel-row-label">Очистить список</span>
          </button>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Косметика</h2>
          <div class="panel-list" id="panelCosmetics"></div>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Приложение</h2>
          <button
            type="button"
            class="panel-row"
            id="rowAutostart"
            role="switch"
            aria-checked="false"
            data-cmd="autostart"
          >
            <span class="panel-row-label">Автозапуск</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowStartTray"
            role="switch"
            aria-checked="false"
            data-cmd="startInTray"
          >
            <span class="panel-row-label">Запускать свёрнутым</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="panel-row"
            id="rowTray"
            role="switch"
            aria-checked="false"
            data-cmd="closeToTray"
          >
            <span class="panel-row-label">Закрывать в трей</span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <button type="button" class="panel-row" data-cmd="openDownloads">
            <span class="panel-row-label">Папка загрузок</span>
          </button>
          <button type="button" class="panel-row" data-cmd="devtools">
            <span class="panel-row-label">Инструменты разработчика</span>
            <kbd>Ctrl Shift I</kbd>
          </button>
          <button type="button" class="panel-row" data-cmd="checkUpdates">
            <span class="panel-row-label">Проверить обновления</span>
          </button>
          <button type="button" class="panel-row" data-cmd="about">
            <span class="panel-row-label">О программе</span>
          </button>
          <button type="button" class="panel-row panel-row--danger" data-cmd="quit">
            <span class="panel-row-label">Выход</span>
          </button>
        </section>
      </div>
    </aside>

    <div class="palette" id="palette" hidden>
      <div class="palette-backdrop" aria-hidden="true"></div>
      <div class="palette-card" role="dialog" aria-modal="true" aria-label="Палитра команд">
        <div class="palette-search">
          <svg
            class="palette-icon"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="9" r="5.2" />
            <path d="m13 13 4 4" />
          </svg>
          <input
            id="paletteInput"
            class="palette-input"
            type="text"
            placeholder="Команда или действие…"
            spellcheck="false"
            autocomplete="off"
            aria-label="Поиск команды"
          />
          <kbd class="palette-esc">Esc</kbd>
        </div>
        <div class="palette-list" id="paletteList" role="listbox" aria-label="Команды"></div>
        <div class="palette-foot">
          <span>↑↓ выбрать</span>
          <span>Enter выполнить</span>
        </div>
      </div>
    </div>

    <script src="titlebar.js"></script>
  </body>
</html>
