<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Обновление приложения</title>
    <link rel="icon" href="assets/octo-logo-mark.png" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="win-chrome.css" />
    <link rel="stylesheet" href="update.css" />
  </head>
  <body class="update">
    <main class="update-card" aria-labelledby="updateTitle">
      <header class="update-head">
        <div class="update-brand">
          <img class="octo-winbar-icon" src="assets/octo-logo-mark.png" alt="" draggable="false" />
          <h1 class="update-title" id="updateTitle">Обновление приложения</h1>
        </div>
        <button type="button" class="update-close" id="btnClose" aria-label="Закрыть">
          <svg
            viewBox="0 0 20 20"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2" />
          </svg>
        </button>
      </header>

      <div class="update-body">
        <p class="update-message" id="updateMessage" aria-live="polite">Доступна версия</p>
        <p class="update-hint" id="updateHint"></p>
        <div class="update-progress" id="updateProgress" hidden>
          <div
            class="update-bar"
            id="updateBar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="updateFill"></span>
          </div>
          <span class="update-percent" id="updatePercent">0 %</span>
        </div>
      </div>

      <footer class="update-actions">
        <button type="button" class="update-btn update-btn--ghost" id="btnLater">Позже</button>
        <button type="button" class="update-btn update-btn--primary" id="btnAction">
          Обновить
        </button>
      </footer>
    </main>

    <script src="i18n-dom.js"></script>
    <script src="theme-sync.js"></script>
    <script src="ui-custom-core.js"></script>
    <script src="win-chrome.js"></script>
    <script src="md3-progress.js"></script>
    <script src="update.js"></script>
  </body>
</html>
