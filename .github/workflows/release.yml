name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          # Универсальная сборка: один dmg/zip и для Apple Silicon, и для Intel.
          - os: macos-latest
            target: --mac --universal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Бинарник Electron
        run: node node_modules/electron/install.js

      - name: Сборка встроенной документации
        run: npm run docs:build

      - name: Сборка и публикация
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Без сертификатов подписи не ищем: сборка останется неподписанной.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # electron-builder создаёт релиз с пустым описанием. Заполняем его разделом
  # этой версии из CHANGELOG.md, когда все сборки уже загружены.
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Заметки из CHANGELOG
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md

      - name: Описание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
